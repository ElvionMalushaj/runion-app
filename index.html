<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07100c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Runion" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Runion is a modern running app with tracking, an AI coach, training plans, community features, and health insights." />
    <title>Runion</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone-shell" aria-live="polite">
      <header class="app-header">
        <button class="avatar-button" type="button" data-route="profile" aria-label="Open profile">
          <span>LM</span>
        </button>
        <div class="header-copy">
          <p id="greeting">Good morning, Lena</p>
          <h1 id="screenTitle">Home</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v1.1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 17.9a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.1a1 1 0 0 1 1-1ZM4.22 4.22a1 1 0 0 1 1.41 0l.78.78A1 1 0 1 1 5 6.41l-.78-.78a1 1 0 0 1 0-1.41Zm13.36 13.36a1 1 0 0 1 1.42 0l.78.79a1 1 0 1 1-1.42 1.41l-.78-.78a1 1 0 0 1 0-1.42ZM2 12a1 1 0 0 1 1-1h1.1a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Zm17.9 0a1 1 0 0 1 1-1H22a1 1 0 1 1 0 2h-1.1a1 1 0 0 1-1-1ZM5 17.59A1 1 0 1 1 6.41 19l-.78.78a1 1 0 1 1-1.41-1.41L5 17.59ZM18.36 4.22a1 1 0 1 1 1.42 1.41L19 6.41A1 1 0 0 1 17.59 5l.77-.78ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.7 2.7 0 0 0 2.6-2h-5.2A2.7 2.7 0 0 0 12 22Zm7-6h-1V9a6 6 0 0 0-4.6-5.84 1.45 1.45 0 0 0-2.8 0A6 6 0 0 0 6 9v7H5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2Z"/></svg>
          </button>
        </div>
      </header>

      <section id="screen" class="screen"></section>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" type="button" data-route="home" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.2Z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button" data-route="activities" aria-label="Activities">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Zm1.3-3.7 3.4-5.8a1 1 0 0 1 1.72-.02l2.1 3.43 1.32-2.1a1 1 0 0 1 1.7.01l3.15 5.02a1 1 0 0 1-.85 1.53H6.16a1 1 0 0 1-.86-1.5Z"/></svg>
          <span>Log</span>
        </button>
        <button class="nav-item run-tab" type="button" data-route="record" aria-label="Start run">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l10.8-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14Z"/></svg>
          <span>Start</span>
        </button>
        <button class="nav-item" type="button" data-route="plans" aria-label="Training plans">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9Z"/></svg>
          <span>Plan</span>
        </button>
        <button class="nav-item" type="button" data-route="community" aria-label="Community">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8.5 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM8 13c-3.3 0-6 1.8-6 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1c0-2.2-2.7-4-6-4Zm8.5 1c-.78 0-1.51.12-2.17.34A4.3 4.3 0 0 1 16 17v1a4 4 0 0 1-.54 2H20a2 2 0 0 0 2-2v-.7c0-1.82-2.48-3.3-5.5-3.3Z"/></svg>
          <span>Team</span>
        </button>
      </nav>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
